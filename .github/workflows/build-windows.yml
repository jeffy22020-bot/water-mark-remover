name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download AI models
        run: python scripts/fetch_models.py

      - name: Generate sample files
        run: python scripts/make_samples.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/WatermarkRemover.spec

      - name: Smoke-test the built app
        shell: pwsh
        run: |
          $env:WMR_DATA_DIR = "$env:RUNNER_TEMP\wmr-data"
          $p = Start-Process -FilePath "dist\WatermarkRemover\WatermarkRemover.exe" -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path "$env:WMR_DATA_DIR\selftest.log") { Get-Content "$env:WMR_DATA_DIR\selftest.log" }
          if (Test-Path "$env:WMR_DATA_DIR\app.log") { Get-Content "$env:WMR_DATA_DIR\app.log" -Tail 60 }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Download WebView2 runtime bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging\MicrosoftEdgeWebview2Setup.exe"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = python -c "import app; print(app.__version__)"
          & $iscc "/DAppVersion=$version" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkRemover-Setup
          path: dist/installer/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Attach installer to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
