name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also create a private (draft) release with this version tag, e.g. v1.0.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download AI models
        run: python scripts/fetch_models.py

      - name: Generate sample files
        run: python scripts/make_samples.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/WatermarkRemover.spec

      - name: Smoke-test the built app
        shell: pwsh
        run: |
          $env:WMR_DATA_DIR = "$env:RUNNER_TEMP\wmr-data"
          $p = Start-Process -FilePath "dist\WatermarkRemover\WatermarkRemover.exe" -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path "$env:WMR_DATA_DIR\selftest.log") { Get-Content "$env:WMR_DATA_DIR\selftest.log" }
          if (Test-Path "$env:WMR_DATA_DIR\app.log") { Get-Content "$env:WMR_DATA_DIR\app.log" -Tail 60 }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build portable app (single .exe, no install needed)
        shell: pwsh
        run: |
          $env:WMR_ONEFILE = "1"
          pyinstaller --noconfirm --clean --workpath build/portable packaging/WatermarkRemover.spec
          if ($LASTEXITCODE -ne 0) { throw "Portable build failed" }

      - name: Smoke-test the portable app
        shell: pwsh
        run: |
          $env:WMR_DATA_DIR = "$env:RUNNER_TEMP\wmr-data-portable"
          $p = Start-Process -FilePath "dist\WatermarkRemover-Portable.exe" -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path "$env:WMR_DATA_DIR\selftest.log") { Get-Content "$env:WMR_DATA_DIR\selftest.log" }
          if ($p.ExitCode -ne 0) { throw "Portable self-test failed with exit code $($p.ExitCode)" }

      - name: Download WebView2 runtime bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging\MicrosoftEdgeWebview2Setup.exe"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = python -c "import app; print(app.__version__)"
          & $iscc "/DAppVersion=$version" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Copy-Item dist\installer\*.exe dist\release\
          Copy-Item dist\WatermarkRemover-Portable.exe "dist\release\WatermarkRemover-Portable-$version.exe"
          Get-ChildItem dist\release

      # Workflow artifacts can be downloaded by anyone when the repository is public,
      # so the installer is only kept here for private repositories.
      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release_tag && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkRemover-Setup
          path: dist/release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Draft releases are only visible to people with write access to the repository.
      - name: Attach installer to a private (draft) GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Watermark Remover ${{ inputs.release_tag || github.ref_name }}
          files: dist/release/*.exe
          body: |
            Watermark Remover ${{ inputs.release_tag || github.ref_name }} for Windows 10/11. Pick one:

            - **`WatermarkRemover-Setup-*.exe` (recommended):** double-click it once. It installs without any questions, puts a **Watermark Remover** icon on your desktop and in the Start menu, and opens the app.
            - **`WatermarkRemover-Portable-*.exe`:** no installing. Save it to your desktop and double-click it to run. It takes a few seconds to open each time.

            If Windows says "Windows protected your PC", click **More info → Run anyway** (the app is not code-signed).

            This is a draft release: only people with write access to this repository can see it.
            Publishing it makes it visible to everyone who can see the repository.
